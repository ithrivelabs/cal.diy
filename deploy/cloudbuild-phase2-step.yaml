# Replace the existing Deploy step after its image push; retain the current build arguments.
id: Deploy
name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
entrypoint: python3
args:
  - scripts/deploy-cloud-run.py
  - --project=$PROJECT_ID
  - --region=asia-southeast1
  - --service=cal-diy
  - --image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/cal.diy/cal-diy:$COMMIT_SHA
  - --release-id=$BUILD_ID
